name: cic-platform-apps

services:
  landing-hub:
    image: node:22-alpine
    container_name: cic-landing-hub
    working_dir: /workspace/apps/landing-hub
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 4301
    volumes:
      - ..:/workspace
    ports:
      - "4301:4301"
    command: ["npm", "run", "start"]

  data-hub:
    image: node:22-alpine
    container_name: cic-data-hub
    working_dir: /workspace/apps/data-hub
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 4302
    volumes:
      - ..:/workspace
    ports:
      - "4302:4302"
    command: ["npm", "run", "start"]

  sync-worker:
    image: node:22-alpine
    container_name: cic-sync-worker
    working_dir: /workspace/apps/sync-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    volumes:
      - ..:/workspace
    command: ["npm", "run", "dev"]

  nginx:
    image: nginx:1.27-alpine
    container_name: cic-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sites.conf.template:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - landing-hub
      - data-hub
